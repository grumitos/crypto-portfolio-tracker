<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f7" />
    <meta
      name="description"
      content="Monitorea tu portafolio crypto: posiciones Dual Investment, simulador de recuperación y calculadora de swing trade."
    />
    <title>Crypto Portfolio Tracker</title>
    <link rel="manifest" href="../public/manifest.json" />
    <link rel="apple-touch-icon" href="../public/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
    <style>
      html {
        background: #faf9f7;
        color: #1a1a18;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        background: #131312;
        color: #f4f3ef;
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: transparent;
        color: inherit;
      }

      .skip-to-content {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
    <script>
      // Anti-FOUC: apply theme before CSS loads to prevent flash
      (function () {
        var t = localStorage.getItem('crypto-theme');
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches);
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.backgroundColor = '#131312';
          document.documentElement.style.colorScheme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = '#131312';
        } else {
          document.documentElement.style.backgroundColor = '#faf9f7';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>

  <body>
    <a href="#view-container" class="skip-to-content">Ir al contenido</a>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
